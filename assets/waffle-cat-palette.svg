<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Waffle Cat 2.0 Base24 palette</title>
  <desc id="desc">Twenty-four warm dark colors arranged as the cocoa ramp, core accents, and Base24 extension.</desc>
  <rect width="1200" height="490" rx="24" fill="#151013"/>
  <rect x="1" y="1" width="1198" height="488" rx="23" fill="none" stroke="#6B5650" stroke-width="2"/>
  <text x="50" y="48" fill="#FFF4D8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="25" font-weight="700">Waffle Cat 2.0</text>
  <text x="1150" y="48" fill="#A58C82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" text-anchor="end">BASE24 · 24 COLORS</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="50" y="88" fill="#C8964B" font-size="13" font-weight="700" letter-spacing="1.5">COCOA &amp; CREAM RAMP</text>
    <rect x="50" y="104" width="120" height="48" rx="8" fill="#292025" stroke="#6B5650"/>
    <rect x="190" y="104" width="120" height="48" rx="8" fill="#362D30" stroke="#6B5650"/>
    <rect x="330" y="104" width="120" height="48" rx="8" fill="#6B5650"/>
    <rect x="470" y="104" width="120" height="48" rx="8" fill="#A58C82"/>
    <rect x="610" y="104" width="120" height="48" rx="8" fill="#A58C82"/>
    <rect x="750" y="104" width="120" height="48" rx="8" fill="#FFF4D8"/>
    <rect x="890" y="104" width="120" height="48" rx="8" fill="#FFF4D8"/>
    <rect x="1030" y="104" width="120" height="48" rx="8" fill="#FFFAF0"/>
    <g fill="#FFF4D8" font-size="12" text-anchor="middle">
      <text x="110" y="171">Cocoa Shadow</text><text x="250" y="171">Waffle Crumb</text><text x="390" y="171">Syrup Wash</text><text x="530" y="171">Coffee Dust</text>
      <text x="670" y="171">Coffee Foam</text><text x="810" y="171">Vanilla Cream</text><text x="950" y="171">Warm Milk</text><text x="1090" y="171">Whipped Cream</text>
    </g>
    <g fill="#A58C82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle">
      <text x="110" y="188">00 · #292025</text><text x="250" y="188">01 · #362D30</text><text x="390" y="188">02 · #6B5650</text><text x="530" y="188">03 · #A58C82</text>
