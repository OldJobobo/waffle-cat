    <rect x="50" y="244" width="120" height="48" rx="8" fill="#CF7358"/>
    <rect x="190" y="244" width="120" height="48" rx="8" fill="#C8964B"/>
    <rect x="330" y="244" width="120" height="48" rx="8" fill="#C8964B"/>
    <rect x="470" y="244" width="120" height="48" rx="8" fill="#9FAD68"/>
    <rect x="610" y="244" width="120" height="48" rx="8" fill="#9EB8B2"/>
    <rect x="750" y="244" width="120" height="48" rx="8" fill="#C87D2A"/>
    <rect x="890" y="244" width="120" height="48" rx="8" fill="#C98C97"/>
    <rect x="1030" y="244" width="120" height="48" rx="8" fill="#644B26"/>
    <g fill="#FFF4D8" font-size="12" text-anchor="middle">
