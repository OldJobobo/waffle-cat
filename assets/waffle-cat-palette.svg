    </g>

    <text x="50" y="368" fill="#C8964B" font-size="13" font-weight="700" letter-spacing="1.5">BASE24 EXTENSION</text>
    <rect x="50" y="384" width="120" height="48" rx="8" fill="#1F181C" stroke="#6B5650"/>
    <rect x="190" y="384" width="120" height="48" rx="8" fill="#151013" stroke="#6B5650"/>
    <rect x="330" y="384" width="120" height="48" rx="8" fill="#E58A70"/>
    <rect x="470" y="384" width="120" height="48" rx="8" fill="#E4C56D"/>
    <rect x="610" y="384" width="120" height="48" rx="8" fill="#B9C97F"/>
    <rect x="750" y="384" width="120" height="48" rx="8" fill="#C2D5D0"/>
    <rect x="890" y="384" width="120" height="48" rx="8" fill="#DF9850"/>
    <rect x="1030" y="384" width="120" height="48" rx="8" fill="#DDB0B8"/>
    <g fill="#FFF4D8" font-size="12" text-anchor="middle">
      <text x="110" y="451">Deep Cocoa</text><text x="250" y="451">Midnight Cocoa</text><text x="390" y="451">Berry Glaze</text><text x="530" y="451">Golden Waffle</text>
      <text x="670" y="451">Pistachio Cream</text><text x="810" y="451">Porcelain Gleam</text><text x="950" y="451">Amber Drizzle</text><text x="1090" y="451">Strawberry Foam</text>
    </g>
    <g fill="#A58C82" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" text-anchor="middle">
      <text x="110" y="468">10 · #1F181C</text><text x="250" y="468">11 · #151013</text><text x="390" y="468">12 · #E58A70</text><text x="530" y="468">13 · #E4C56D</text>
      <text x="670" y="468">14 · #B9C97F</text><text x="810" y="468">15 · #C2D5D0</text><text x="950" y="468">16 · #DF9850</text><text x="1090" y="468">17 · #DDB0B8</text>
